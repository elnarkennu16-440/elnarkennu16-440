ransform="translate(-9.15,-9.15) scale(0.8125)" fill="#5c5c63"/><use href="#ic-mdi-hand-wave" transform="translate(-9.75,-9.75) scale(0.8125)" fill="#f4f4f6"/></g></g></g><text x="192" y="46" font-size="23" class="serif" text-anchor="start" fill="#f4f4f6" font-style="italic" font-weight="700">3D Vision Track</text><text x="192" y="72" font-size="13.5" class="sans" fill="#a0a0a8">Real-time computer vision app that tracks both hands to span an interactive 2D</text><text x="192" y="92" font-size="13.5" class="sans" fill="#a0a0a8">quadrilateral or a 3D six-sided box between them.</text><g transform="translate(192,106)"><rect width="63.4" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="31.7" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">Python</text></g><g transform="translate(265.4,106)"><rect width="63.4" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="31.7" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">OpenCV</text></g><g transform="translate(338.79999999999995,106)"><rect width="84.1" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="42.0" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">MediaPipe</text></g><use href="#ic-mdi-star" transform="translate(829.4,32) scale(.75)" fill="#d8d8de"/><text x="862" y="47" font-size="15" font-weight="700" text-anchor="end" class="sans" fill="#e6e6ea">2</text><text x="838" y="124" font-size="12.5" text-anchor="end" class="sans" fill="#d0d0d6">View repository</text><path d="M848 124 h14 M857 118 l6 6 l-6 6" fill="none" stroke="#d0d0d6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>