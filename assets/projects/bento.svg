<svg xmlns="http://www.w3.org/2000/svg" width="450" height="160" viewBox="0 0 450 160" role="img" aria-label="Bento Grid Portfolio"><title>Bento Grid Portfolio</title><desc>Portfolio template with a Bento Grid layout, 3D tilt interactions and glassmorphism.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient><path id="ic-mdi-star" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.45 4.73L5.82 21z"/><path id="ic-mdi-view-dashboard" d="M13 3v6h8V3m-8 18h8V11h-8M3 21h8v-6H3m0-2h8V3H3z"/></defs><rect x=".5" y=".5" width="449" height="159" rx="16" fill="#111113" stroke="#26262a"/><g transform="translate(52,44) scale(0.95)"><ellipse class="sh" cx="0" cy="26" rx="26" ry="6" fill="#000" style="animation-delay:-2.7s"/><g class="fl" style="animation-delay:-2.7s"><polygon points="-26,0 0,15 0,25 -26,10" fill="#1d1d20" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,15 26,0 26,10 0,25" fill="#131315" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,-15 26,0 0,15 -26,0" fill="url(#gt)" stroke="#5a5a61" stroke-width=".7" stroke-linejoin="round"/><polyline points="-26,0 0,-15 26,0" fill="none" stroke="#7a7a82" stroke-width=".9" stroke-linejoin="round"/><g transform="matrix(.866 .5 -.866 .5 0 0)"><use href="#ic-mdi-view-dashboard" transform="translate(-7.35,-7.35) scale(0.8125)" fill="#0e0e10"/><use href="#ic-mdi-view-dashboard" transform="translate(-7.95,-7.95) scale(0.8125)" fill="#1f1f23"/><use href="#ic-mdi-view-dashboard" transform="translate(-8.55,-8.55) scale(0.8125)" fill="#38383e"/><use href="#ic-mdi-view-dashboard" transform="translate(-9.15,-9.15) scale(0.8125)" fill="#5c5c63"/><use href="#ic-mdi-view-dashboard" transform="translate(-9.75,-9.75) scale(0.8125)" fill="#f4f4f6"/></g></g></g><text x="96" y="50" font-size="20" class="serif" text-anchor="start" fill="#f4f4f6" font-style="italic" font-weight="700">Bento Grid Portfolio</text><use href="#ic-mdi-star" transform="translate(395.4,31) scale(.75)" fill="#d8d8de"/><text x="426" y="46" font-size="15" font-weight="700" text-anchor="end" class="sans" fill="#e6e6ea">2</text><text x="24" y="96" font-size="13" class="sans" fill="#a0a0a8">Portfolio template with a Bento Grid layout, 3D tilt</text><text x="24" y="114" font-size="13" class="sans" fill="#a0a0a8">interactions and glassmorphism.</text><g transform="translate(24.0,126)"><rect width="52.0" height="22" rx="11" fill="#151517" stroke="#34343a"/><text x="26.0" y="15" font-size="10.5" text-anchor="middle" class="mono" fill="#b4b4bb">React</text></g><g transform="translate(84.0,126)"><rect width="96.8" height="22" rx="11" fill="#151517" stroke="#34343a"/><text x="48.4" y="15" font-size="10.5" text-anchor="middle" class="mono" fill="#b4b4bb">Tailwind CSS</text></g><g transform="translate(188.8,126)"><rect width="103.2" height="22" rx="11" fill="#151517" stroke="#34343a"/><text x="51.6" y="15" font-size="10.5" text-anchor="middle" class="mono" fill="#b4b4bb">Framer Motion</text></g></svg>