<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Bento Grid Portfolio"><title>Bento Grid Portfolio</title><desc>Immersive portfolio template with a Bento Grid layout, 3D tilt interactions and glassmorphism, animated with Framer Motion.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient>
</defs><rect x=".5" y=".5" width="899" height="149" rx="18" fill="#111113" stroke="#26262a"/><line x1="162" y1="22" x2="162" y2="128" stroke="#26262a"/><g transform="translate(81,66) scale(1.45)"><ellipse class="sh" cx="0" cy="26" rx="26" ry="6" fill="#000" style="animation-delay:-2.7s"/><g class="fl" style="animation-delay:-2.7s"><polygon points="-26,0 0,15 0,25 -26,10" fill="#1d1d20" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,15 26,0 26,10 0,25" fill="#131315" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,-15 26,0 0,15 -26,0" fill="url(#gt)" stroke="#5a5a61" stroke-width=".7" stroke-linejoin="round"/><polyline points="-26,0 0,-15 26,0" fill="none" stroke="#7a7a82" stroke-width=".9" stroke-linejoin="round"/><g transform="matrix(.866 .5 -.866 .5 0 0)"><text y="6.12" font-size="17" font-weight="800" text-anchor="middle" class="sans" fill="#f2f2f4">BG</text></g></g></g><text x="192" y="44" font-size="22" font-weight="700" class="sans" fill="#f4f4f6">Bento Grid Portfolio</text><text x="192" y="70" font-size="13.5" class="sans" fill="#a0a0a8">Immersive portfolio template with a Bento Grid layout, 3D tilt interactions and</text><text x="192" y="90" font-size="13.5" class="sans" fill="#a0a0a8">glassmorphism, animated with Framer Motion.</text><g transform="translate(192,104)"><rect width="56.5" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="28.2" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">React</text></g><g transform="translate(258.5,104)"><rect width="104.8" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="52.4" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">Tailwind CSS</text></g><g transform="translate(373.3,104)"><rect width="111.7" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="55.9" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">Framer Motion</text></g><text x="838" y="122" font-size="12.5" text-anchor="end" class="sans" fill="#d0d0d6">View repository</text><path d="M848 122 h14 M857 116 l6 6 l-6 6" transform="translate(0,-0)" fill="none" stroke="#d0d0d6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>