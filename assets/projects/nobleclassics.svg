e="20" class="serif" text-anchor="start" fill="#f4f4f6" font-style="italic" font-weight="700">NobleClassics</text><use href="#ic-mdi-star" transform="translate(395.4,31) scale(.75)" fill="#d8d8de"/><text x="426" y="46" font-size="15" font-weight="700" text-anchor="end" class="sans" fill="#e6e6ea">2</text><text x="24" y="96" font-size="13" class="sans" fill="#a0a0a8">Full e-commerce bookstore on a custom PHP backend, from</text><text x="24" y="114" font-size="13" class="sans" fill="#a0a0a8">cart to checkout, with an admin dashboard.</text><g transform="translate(24.0,126)"><rect width="39.2" height="22" rx="11" fill="#151517" stroke="#34343a"/><text x="19.6" y="15" font-size="10.5" text-anchor="middle" class="mono" fill="#b4b4bb">PHP</text></g><g transform="translate(71.2,126)"><rect width="84.0" height="22" rx="11" fill="#151517" stroke="#34343a"/><text x="42.0" y="15" font-size="10.5" text-anchor="middle" class="mono" fill="#b4b4bb">E-Commerce</text></g><g transform="translate(163.2,126)"><rect width="116.0" height="22" rx="11" fill="#151517" stroke="#34343a"/><text x="58.0" y="15" font-size="10.5" text-anchor="middle" class="mono" fill="#b4b4bb">Admin Dashboard</text></g></svg>