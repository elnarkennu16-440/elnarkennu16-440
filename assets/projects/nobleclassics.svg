ont-style="italic" font-weight="700">NobleClassics</text><text x="192" y="72" font-size="13.5" class="sans" fill="#a0a0a8">Full-featured e-commerce bookstore on a custom PHP backend, from cart to checkout,</text><text x="192" y="92" font-size="13.5" class="sans" fill="#a0a0a8">with a dedicated admin dashboard.</text><g transform="translate(192,106)"><rect width="42.7" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="21.4" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">PHP</text></g><g transform="translate(244.7,106)"><rect width="91.0" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="45.5" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">E-Commerce</text></g><g transform="translate(345.7,106)"><rect width="125.5" height="24" rx="12" fill="#151517" stroke="#34343a"/><text x="62.8" y="16" font-size="11.5" text-anchor="middle" class="mono" fill="#b4b4bb">Admin Dashboard</text></g><text x="838" y="124" font-size="12.5" text-anchor="end" class="sans" fill="#d0d0d6">View repository</text><path d="M848 124 h14 M857 118 l6 6 l-6 6" fill="none" stroke="#d0d0d6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>