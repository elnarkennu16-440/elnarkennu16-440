<svg xmlns="http://www.w3.org/2000/svg" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="Most used languages"><title>Most used languages</title><desc>Share of each programming language across public repositories.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="195" rx="18" fill="#111113" stroke="#26262a"/><text x="40" y="46" font-size="16" font-weight="700" class="sans" fill="#f4f4f6">Most used languages</text><text x="860" y="46" font-size="11" text-anchor="end" class="mono" fill="#5c5c64">by code size, public repositories</text><clipPath id="bar"><rect x="40" y="64" width="820" height="14" rx="7"/></clipPath><g clip-path="url(#bar)"><rect x="40" y="64" width="820" height="14" fill="#2a2a2f"/></g><text x="40" y="118" font-size="13" class="sans" fill="#8e8e96">Run the Build profile assets workflow once to fill this in.</text></svg>