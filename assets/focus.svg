<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Current focus"><title>Current focus</title><desc>Web development, quality and testing, practical tooling.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient>
</defs><g transform="translate(0,0)"><rect x=".5" y=".5" width="275" height="249" rx="18" fill="#111113" stroke="#26262a"/><g transform="translate(62,66) scale(1.35)"><ellipse class="sh" cx="0" cy="26" rx="26" ry="6" fill="#000" style="animation-delay:-0.0s"/><g class="fl" style="animation-delay:-0.0s"><polygon points="-26,0 0,15 0,25 -26,10" fill="#1d1d20" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,15 26,0 26,10 0,25" fill="#131315" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,-15 26,0 0,15 -26,0" fill="url(#gt)" stroke="#5a5a61" stroke-width=".7" stroke-linejoin="round"/><polyline points="-26,0 0,-15 26,0" fill="none" stroke="#7a7a82" stroke-width=".9" stroke-linejoin="round"/><g transform="matrix(.866 .5 -.866 .5 0 0)"><text y="6.12" font-size="17" font-weight="800" text-anchor="middle" class="sans" fill="#f2f2f4">WD</text></g></g></g><text x="26" y="136" font-size="19" font-weight="700" class="sans" fill="#f4f4f6">Web Development</text><text x="26" y="164" font-size="13.5" class="sans" fill="#a0a0a8">Building responsive interfaces and</text><text x="26" y="184" font-size="13.5" class="sans" fill="#a0a0a8">straightforward server-side</text><text x="26" y="204" font-size="13.5" class="sans" fill="#a0a0a8">systems.</text></g><g transform="translate(312,0)"><rect x=".5" y=".5" width="275" height="249" rx="18" fill="#111113" stroke="#26262a"/><g transform="translate(62,66) scale(1.35)"><ellipse class="sh" cx="0" cy="26" rx="26" ry="6" fill="#000" style="animation-delay:-1.1s"/><g class="fl" style="animation-delay:-1.1s"><polygon points="-26,0 0,15 0,25 -26,10" fill="#1d1d20" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,15 26,0 26,10 0,25" fill="#131315" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,-15 26,0 0,15 -26,0" fill="url(#gt)" stroke="#5a5a61" stroke-width=".7" stroke-linejoin="round"/><polyline points="-26,0 0,-15 26,0" fill="none" stroke="#7a7a82" stroke-width=".9" stroke-linejoin="round"/><g transform="matrix(.866 .5 -.866 .5 0 0)"><text y="6.12" font-size="17" font-weight="800" text-anchor="middle" class="sans" fill="#f2f2f4">QA</text></g></g></g><text x="26" y="136" font-size="19" font-weight="700" class="sans" fill="#f4f4f6">Quality &amp; Testing</text><text x="26" y="164" font-size="13.5" class="sans" fill="#a0a0a8">Exploring manual testing, test</text><text x="26" y="184" font-size="13.5" class="sans" fill="#a0a0a8">scenarios, and automated checks to</text><text x="26" y="204" font-size="13.5" class="sans" fill="#a0a0a8">improve application stability.</text></g><g transform="translate(624,0)"><rect x=".5" y=".5" width="275" height="249" rx="18" fill="#111113" stroke="#26262a"/><g transform="translate(62,66) scale(1.35)"><ellipse class="sh" cx="0" cy="26" rx="26" ry="6" fill="#000" style="animation-delay:-2.2s"/><g class="fl" style="animation-delay:-2.2s"><polygon points="-26,0 0,15 0,25 -26,10" fill="#1d1d20" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,15 26,0 26,10 0,25" fill="#131315" stroke="#4a4a50" stroke-width=".6" stroke-linejoin="round"/><polygon points="0,-15 26,0 0,15 -26,0" fill="url(#gt)" stroke="#5a5a61" stroke-width=".7" stroke-linejoin="round"/><polyline points="-26,0 0,-15 26,0" fill="none" stroke="#7a7a82" stroke-width=".9" stroke-linejoin="round"/><g transform="matrix(.866 .5 -.866 .5 0 0)"><text y="4.50" font-size="12.5" font-weight="800" text-anchor="middle" class="sans" fill="#f2f2f4">GIT</text></g></g></g><text x="26" y="136" font-size="19" font-weight="700" class="sans" fill="#f4f4f6">Practical Tooling</text><text x="26" y="164" font-size="13.5" class="sans" fill="#a0a0a8">Improving day-to-day Git</text><text x="26" y="184" font-size="13.5" class="sans" fill="#a0a0a8">workflows, database modeling, and</text><text x="26" y="204" font-size="13.5" class="sans" fill="#a0a0a8">structured development setups.</text></g></svg>