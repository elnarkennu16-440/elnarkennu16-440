<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-label="GitHub stats"><title>GitHub stats</title><desc>Repositories, stars, followers, commits, pull requests, issues and contribution streaks.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="261" rx="18" fill="#111113" stroke="#26262a"/><line x1="452" y1="28" x2="452" y2="234" stroke="#26262a"/><text x="42" y="70" font-size="30" font-weight="700" class="sans" fill="#f4f4f6">-</text><text x="42" y="91" font-size="12.5" class="sans" fill="#8e8e96">Public repositories</text><text x="247" y="70" font-size="30" font-weight="700" class="sans" fill="#f4f4f6">-</text><text x="247" y="91" font-size="12.5" class="sans" fill="#8e8e96">Stars earned</text><text x="42" y="136" font-size="30" font-weight="700" class="sans" fill="#f4f4f6">-</text><text x="42" y="157" font-size="12.5" class="sans" fill="#8e8e96">Followers</text><text x="247" y="136" font-size="30" font-weight="700" class="sans" fill="#f4f4f6">-</text><text x="247" y="157" font-size="12.5" class="sans" fill="#8e8e96">Commits, last year</text><text x="42" y="202" font-size="30" font-weight="700" class="sans" fill="#f4f4f6">-</text><text x="42" y="223" font-size="12.5" class="sans" fill="#8e8e96">Pull requests</text><text x="247" y="202" font-size="30" font-weight="700" class="sans" fill="#f4f4f6">-</text><text x="247" y="223" font-size="12.5" class="sans" fill="#8e8e96">Issues</text><text x="540" y="120" font-size="34" font-weight="700" text-anchor="middle" class="sans" fill="#f4f4f6">-</text><text x="540" y="176" font-size="13" text-anchor="middle" class="sans" fill="#d0d0d6">Total contributions</text><text x="540" y="196" font-size="11" text-anchor="middle" class="mono" fill="#8e8e96">waiting for first run</text><circle cx="676" cy="108" r="40" fill="none" stroke="#2c2c31" stroke-width="6"/><circle cx="676" cy="108" r="40" fill="none" stroke="#f4f4f6" stroke-width="6" stroke-linecap="round" stroke-dasharray="196.0 999" transform="rotate(-90 676 108)"/><text x="676" y="119" font-size="32" font-weight="700" text-anchor="middle" class="sans" fill="#f4f4f6">-</text><text x="676" y="176" font-size="13" text-anchor="middle" class="sans" fill="#d0d0d6">Current streak</text><text x="676" y="196" font-size="11" text-anchor="middle" class="mono" fill="#8e8e96">no active streak</text><text x="812" y="120" font-size="34" font-weight="700" text-anchor="middle" class="sans" fill="#f4f4f6">-</text><text x="812" y="176" font-size="13" text-anchor="middle" class="sans" fill="#d0d0d6">Longest streak</text><text x="812" y="196" font-size="11" text-anchor="middle" class="mono" fill="#8e8e96"></text><text x="42" y="242" font-size="10.5" class="mono" fill="#5c5c64">Run the 'Build profile assets' workflow once to fill in live numbers</text></svg>