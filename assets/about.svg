<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246" role="img" aria-label="About Kennu Elnar"><title>About Kennu Elnar</title><desc>Short bio and quick facts about Kennu Elnar.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="245" rx="16" fill="#111113" stroke="#26262a"/><text x="34" y="46" font-size="15" class="sans" fill="#cdcdd3">I'm Kennu, an Information Systems graduate and builder based</text><text x="34" y="69" font-size="15" class="sans" fill="#cdcdd3">in the Philippines. I focus on developing clean web</text><text x="34" y="92" font-size="15" class="sans" fill="#cdcdd3">interfaces, exploring practical backend logic, and testing</text><text x="34" y="115" font-size="15" class="sans" fill="#cdcdd3">software workflows to ensure applications run reliably.</text><text x="34" y="150" font-size="15" class="sans" fill="#cdcdd3">Whether I'm building personal projects or running functional</text><text x="34" y="173" font-size="15" class="sans" fill="#cdcdd3">tests to catch edge cases, I value simple structure,</text><text x="34" y="196" font-size="15" class="sans" fill="#cdcdd3">consistent practice, and steady iteration.</text><rect x="560" y="20" width="312" height="206" rx="12" fill="#0a0a0b" stroke="#2f2f35"/><text x="582" y="50" font-size="10.5" class="mono" fill="#8e8e96">Role</text><text x="582" y="67" font-size="14.5" class="sans" font-weight="600" fill="#f1f1f3">Frontend Dev &amp; QA Tester</text><line x1="582" y1="78" x2="850" y2="78" stroke="#26262a"/><text x="582" y="87" font-size="10.5" class="mono" fill="#8e8e96">Education</text><text x="582" y="104" font-size="14.5" class="sans" font-weight="600" fill="#f1f1f3">Information Systems graduate</text><line x1="582" y1="115" x2="850" y2="115" stroke="#26262a"/><text x="582" y="124" font-size="10.5" class="mono" fill="#8e8e96">Location</text><text x="582" y="141" font-size="14.5" class="sans" font-weight="600" fill="#f1f1f3">Philippines</text><line x1="582" y1="152" x2="850" y2="152" stroke="#26262a"/><text x="582" y="161" font-size="10.5" class="mono" fill="#8e8e96">Focus</text><text x="582" y="178" font-size="14.5" class="sans" font-weight="600" fill="#f1f1f3">Web, testing, tooling</text><line x1="582" y1="189" x2="850" y2="189" stroke="#26262a"/><text x="582" y="198" font-size="10.5" class="mono" fill="#8e8e96">Portfolio</text><text x="582" y="215" font-size="14.5" class="sans" font-weight="600" fill="#f1f1f3">elnarkennu.vercel.app</text><g transform="translate(840,50)"><g class="b1" style="animation-delay:-2s"><polygon points="0,-9.00 7.79,-4.50 0,0 -7.79,-4.50" fill="#55555c" stroke="#6a6a72" stroke-width=".7" stroke-linejoin="round"/><polygon points="-7.79,-4.50 0,0 0,9.00 -7.79,4.50" fill="#2a2a2e" stroke="#6a6a72" stroke-width=".7" stroke-linejoin="round"/><polygon points="0,0 7.79,-4.50 7.79,4.50 0,9.00" fill="#17171a" stroke="#6a6a72" stroke-width=".7" stroke-linejoin="round"/></g></g></svg>