<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334" role="img" aria-label="About Kennu Elnar"><title>About Kennu Elnar</title><desc>Short bio and quick facts about Kennu Elnar.</desc><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobM{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bobL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.84);opacity:.28}}
.fl{animation:bob 4.8s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shd 4.8s ease-in-out infinite}
.b1{animation:bobS 6s ease-in-out infinite} .b2{animation:bobM 7.5s ease-in-out infinite} .b3{animation:bobL 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c4c53"/><stop offset="1" stop-color="#2b2b30"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="333" rx="18" fill="#111113" stroke="#26262a"/><text x="40" y="58" font-size="15.5" class="sans" fill="#cdcdd3">I'm Kennu, an Information Systems graduate and</text><text x="40" y="84" font-size="15.5" class="sans" fill="#cdcdd3">builder based in the Philippines. I focus on</text><text x="40" y="110" font-size="15.5" class="sans" fill="#cdcdd3">developing clean web interfaces, exploring practical</text><text x="40" y="136" font-size="15.5" class="sans" fill="#cdcdd3">backend logic, and testing software workflows to</text><text x="40" y="162" font-size="15.5" class="sans" fill="#cdcdd3">ensure applications run reliably.</text><text x="40" y="204" font-size="15.5" class="sans" fill="#cdcdd3">Whether I'm building personal projects or running</text><text x="40" y="230" font-size="15.5" class="sans" fill="#cdcdd3">functional tests to catch edge cases, I value simple</text><text x="40" y="256" font-size="15.5" class="sans" fill="#cdcdd3">structure, consistent practice, and steady</text><text x="40" y="282" font-size="15.5" class="sans" fill="#cdcdd3">iteration.</text><rect x="556" y="30" width="316" height="274" rx="14" fill="#0a0a0b" stroke="#2f2f35"/><text x="580" y="72" font-size="11.5" class="mono" fill="#8e8e96">Role</text><text x="580" y="93" font-size="15" class="sans" font-weight="600" fill="#f1f1f3">Frontend Dev &amp; QA Tester</text><line x1="580" y1="108" x2="848" y2="108" stroke="#26262a"/><text x="580" y="122" font-size="11.5" class="mono" fill="#8e8e96">Education</text><text x="580" y="143" font-size="15" class="sans" font-weight="600" fill="#f1f1f3">Information Systems graduate</text><line x1="580" y1="158" x2="848" y2="158" stroke="#26262a"/><text x="580" y="172" font-size="11.5" class="mono" fill="#8e8e96">Location</text><text x="580" y="193" font-size="15" class="sans" font-weight="600" fill="#f1f1f3">Philippines</text><line x1="580" y1="208" x2="848" y2="208" stroke="#26262a"/><text x="580" y="222" font-size="11.5" class="mono" fill="#8e8e96">Focus</text><text x="580" y="243" font-size="15" class="sans" font-weight="600" fill="#f1f1f3">Web, testing, tooling</text><line x1="580" y1="258" x2="848" y2="258" stroke="#26262a"/><text x="580" y="272" font-size="11.5" class="mono" fill="#8e8e96">Portfolio</text><text x="580" y="293" font-size="15" class="sans" font-weight="600" fill="#f1f1f3">elnarkennu.vercel.app</text><g transform="translate(834,68)"><g class="b1" style="animation-delay:-2s"><polygon points="0,-11.00 9.53,-5.50 0,0 -9.53,-5.50" fill="#55555c" stroke="#6a6a72" stroke-width=".7" stroke-linejoin="round"/><polygon points="-9.53,-5.50 0,0 0,11.00 -9.53,5.50" fill="#2a2a2e" stroke="#6a6a72" stroke-width=".7" stroke-linejoin="round"/><polygon points="0,0 9.53,-5.50 9.53,5.50 0,11.00" fill="#17171a" stroke="#6a6a72" stroke-width=".7" stroke-linejoin="round"/></g></g></svg>