name: Build profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "generator/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: python -m pip install fonttools

      - name: Download Kaushan Script font
        continue-on-error: true
        run: |
          mkdir -p generator/fonts
          curl -fsSL -o generator/fonts/KaushanScript-Regular.ttf "https://fonts.gstatic.com/s/kaushanscript/v19/vm8vdRfvXFLG3OLnsO15WYS5DF7_.ttf" \
          || curl -fsSL -o generator/fonts/KaushanScript-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/kaushanscript/KaushanScript-Regular.ttf"

      - name: Fetch live GitHub stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python generator/fetch_stats.py

      - name: Build SVG assets
        env:
          FETCH_BRAND_ICONS: "1"
        run: python generator/build_assets.py

      - name: Generate contribution snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#111111&color_dots=#ebedf0,#c9c9ce,#99999f,#606068,#2a2a30
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161618,#303034,#505056,#909098,#d8d8dc

      - name: Copy snake into assets
        run: |
          for f in github-snake.svg github-snake-dark.svg; do
            if [ -f "dist/$f" ]; then cp "dist/$f" "assets/$f"; else echo "no $f generated"; fi
          done

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git add generator/stats.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          fi
